; ============================================================
;  picomusic  —  seven instruments on one hardware platform (the "tower")
;
;  The tower:  Pico 2 (bottom)  +  USB shield (MIDI in + USB host)  +  Pico-Audio shield  +  Pico-LCD-1.14 (top)
;
;  Pick the instrument by picking the environment:
;
;      pio run -e piano -t upload          (or choose the environment in the VS Code status bar)
;
;      tonewheel   Hammond-style tonewheel organ        synth     polyphonic analog synthesizer
;      strings     string machine / ensemble            bass      Moog-style mono bass + sequencer
;      drums       808-style drum machine + sequencer   piano     sampled piano / Rhodes / clavinet (4 MB flash)
;      dx7         6-operator FM synthesizer
;
;  Every instrument also has a  <name>_nohost  environment: the same firmware at 200 MHz with the USB
;  host off (MIDI from the Pico's own USB port or the DIN/TRS input only).
;
;  Source layout (src_dir = firmware):
;      firmware/shared/<file>      code every instrument uses (audio driver + PIO programs, USB host, ...)
;      firmware/<instrument>/      everything that belongs to one instrument
;  An environment compiles firmware/<instrument>/ plus the few firmware/shared/ files it names in
;  build_src_filter; headers are found through the two -I paths in its build_flags.
; ============================================================

[platformio]
src_dir      = firmware
default_envs = tonewheel

; ---- one switch for the audio shield ---------------------------------------------------------------
;  Waveshare Pico-Audio:   0 = "Initial Version" (PCM5101A, no marking on the PCB)
;                          1 = "Rev2.1" (CS4344, printed on the PCB)
;  Software cannot tell them apart and the wrong setting is SILENT. It selects the I2S pins and the PIO program.
[audio]
rev2_1 = 1

[base]
platform         = https://github.com/maxgerhardt/platform-raspberrypi.git
framework        = arduino
board_build.core = earlephilhower
board            = rpipico2
monitor_speed    = 115200
lib_deps =
    https://github.com/adafruit/Adafruit_TinyUSB_Arduino.git
    https://github.com/FortySevenEffects/arduino_midi_library.git

; flags every build gets
[flags]
build_flags =
    -O2
    -DUSE_TINYUSB
    -DCFG_TUD_MIDI=1
    -DAUDIO_BOARD_REV2_1=${audio.rev2_1}
    -Ifirmware/shared

; USB host on the USB shield (D+ = GP6, D- = GP7): 240 MHz gives exact PIO clock divisors for full speed
[host]
board_build.f_cpu = 240000000L
build_flags =
    ${flags.build_flags}
    -DCFG_TUH_ENABLED=1
    -DCFG_TUH_MIDI=1
    -DCFG_TUH_RPI_PIO_USB=1
    -DCFG_TUH_MAX_SPEED=OPT_MODE_FULL_SPEED
    -DCFG_TUH_HUB=1
    -DPIO_USB_DP_PIN_DEFAULT=6
    -DENABLE_USB_HOST=1

; no USB host: audio and MIDI only (USB device port, UART)
[nohost]
board_build.f_cpu = 200000000L
build_flags =
    ${flags.build_flags}
    -DENABLE_USB_HOST=0

; ============================================================
;  Tonewheel organ
; ============================================================
[env:tonewheel]
extends          = base
board_build.f_cpu = ${host.board_build.f_cpu}
build_src_filter = -<*> +<tonewheel/>
build_flags      = ${host.build_flags} -Ifirmware/tonewheel

[env:tonewheel_nohost]
extends          = base
board_build.f_cpu = ${nohost.board_build.f_cpu}
build_src_filter = -<*> +<tonewheel/>
build_flags      = ${nohost.build_flags} -Ifirmware/tonewheel

; ============================================================
;  Analog synthesizer
; ============================================================
[env:synth]
extends          = base
board_build.f_cpu = ${host.board_build.f_cpu}
build_src_filter = -<*> +<synth/>
build_flags      = ${host.build_flags} -Ifirmware/synth

[env:synth_nohost]
extends          = base
board_build.f_cpu = ${nohost.board_build.f_cpu}
build_src_filter = -<*> +<synth/>
build_flags      = ${nohost.build_flags} -Ifirmware/synth

; ============================================================
;  String machine
; ============================================================
[env:strings]
extends          = base
board_build.f_cpu = ${host.board_build.f_cpu}
build_src_filter = -<*> +<strings/> +<shared/wavetable.cpp>
build_flags      = ${host.build_flags} -Ifirmware/strings

[env:strings_nohost]
extends          = base
board_build.f_cpu = ${nohost.board_build.f_cpu}
build_src_filter = -<*> +<strings/> +<shared/wavetable.cpp>
build_flags      = ${nohost.build_flags} -Ifirmware/strings

; ============================================================
;  Bass synthesizer + step sequencer   (0.5 MB of flash is a LittleFS partition for saved patterns)
; ============================================================
[env:bass]
extends          = base
board_build.f_cpu = ${host.board_build.f_cpu}
board_build.filesystem = littlefs
board_build.filesystem_size = 0.5m
build_src_filter = -<*> +<bass/>
build_flags      = ${host.build_flags} -Ifirmware/bass

[env:bass_nohost]
extends          = base
board_build.f_cpu = ${nohost.board_build.f_cpu}
board_build.filesystem = littlefs
board_build.filesystem_size = 0.5m
build_src_filter = -<*> +<bass/>
build_flags      = ${nohost.build_flags} -Ifirmware/bass

; ============================================================
;  Drum machine + step sequencer   (0.5 MB LittleFS partition for saved patterns and kit)
; ============================================================
[env:drums]
extends          = base
board_build.f_cpu = ${host.board_build.f_cpu}
board_build.filesystem = littlefs
board_build.filesystem_size = 0.5m
build_src_filter = -<*> +<drums/> +<shared/wavetable.cpp>
build_flags      = ${host.build_flags} -Ifirmware/drums

[env:drums_nohost]
extends          = base
board_build.f_cpu = ${nohost.board_build.f_cpu}
board_build.filesystem = littlefs
board_build.filesystem_size = 0.5m
build_src_filter = -<*> +<drums/> +<shared/wavetable.cpp>
build_flags      = ${nohost.build_flags} -Ifirmware/drums

; ============================================================
;  Sampled piano / Rhodes / clavinet   (no filesystem: the ~3 MB of ADPCM samples need the flash)
; ============================================================
[env:piano]
extends          = base
board_build.f_cpu = ${host.board_build.f_cpu}
board_build.filesystem_size = 0m
build_src_filter = -<*> +<piano/>
build_flags      = ${host.build_flags} -Ifirmware/piano

[env:piano_nohost]
extends          = base
board_build.f_cpu = ${nohost.board_build.f_cpu}
board_build.filesystem_size = 0m
build_src_filter = -<*> +<piano/>
build_flags      = ${nohost.build_flags} -Ifirmware/piano

; ============================================================
;  DX7: six-operator FM synthesizer   (accepts DX7 32-voice SysEx banks over any MIDI input)
; ============================================================
[env:dx7]
extends          = base
board_build.f_cpu = ${host.board_build.f_cpu}
build_src_filter = -<*> +<dx7/>
build_flags      = ${host.build_flags} -Ifirmware/dx7

[env:dx7_nohost]
extends          = base
board_build.f_cpu = ${nohost.board_build.f_cpu}
build_src_filter = -<*> +<dx7/>
build_flags      = ${nohost.build_flags} -Ifirmware/dx7
